<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>小账房 · 商品结算练习</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #68738a;
      --line: #e7eaf1;
      --paper: #fff;
      --bg: #f6f7fb;
      --brand: #5b55e7;
      --brand-dark: #4540c7;
      --mint: #e8f8f2;
      --shadow: 0 16px 42px rgba(34, 43, 74, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1160px; margin: 0 auto; padding: 28px 24px 64px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 32px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { display: grid; place-items: center; width: 46px; height: 46px; color: white; font-size: 23px; border-radius: 15px; background: linear-gradient(135deg, #7771ff, #4b45d5); box-shadow: 0 8px 18px #5b55e745; }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.4px; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .demo-badge { border: 1px solid #dcdafa; color: var(--brand-dark); background: #f0efff; border-radius: 999px; padding: 8px 13px; font-size: 12px; font-weight: 700; }
    .intro { margin-bottom: 24px; }
    .intro h2 { font-size: clamp(24px, 4vw, 34px); letter-spacing: -1px; margin: 0 0 8px; }
    .intro p { color: var(--muted); margin: 0; font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
    .products-panel { padding: 22px; }
    .section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 17px; }
    .section-heading h3, .cart-title h3 { margin: 0; font-size: 16px; }
    .section-heading span, .cart-title span { font-size: 12px; color: var(--muted); }
    .product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .product { border: 1px solid var(--line); border-radius: 15px; padding: 15px; transition: border-color .2s, transform .2s, box-shadow .2s; }
    .product:hover { border-color: #c8c5ff; transform: translateY(-2px); box-shadow: 0 8px 20px #5b55e711; }
    .product-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .emoji { width: 42px; height: 42px; display: grid; place-items: center; font-size: 23px; background: #f3f4fa; border-radius: 13px; }
    .product-tag { color: #788198; font-size: 10px; background: #f4f5f8; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
    .product h4 { margin: 13px 0 4px; font-size: 14px; }
    .product .desc { color: var(--muted); font-size: 11px; margin: 0; }
    .product-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
    .price { font-weight: 800; font-size: 17px; letter-spacing: -.3px; }
    .price small { color: var(--muted); font-size: 11px; font-weight: 500; }
    .add-btn, .primary-btn { border: 0; background: var(--brand); color: white; font-weight: 700; border-radius: 10px; transition: background .2s, transform .2s; }
    .add-btn { padding: 8px 12px; font-size: 12px; }
    .add-btn:hover, .primary-btn:hover { background: var(--brand-dark); transform: translateY(-1px); }
    .side { display: grid; gap: 16px; }
    .cart-panel { padding: 20px; }
    .cart-title { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
    .cart-count { background: #f0efff; color: var(--brand-dark); padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .cart-items { min-height: 78px; }
    .empty { color: #8992a5; font-size: 13px; text-align: center; padding: 25px 0; }
    .cart-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 13px 0; border-bottom: 1px solid #f0f1f5; }
    .item-name { font-size: 12px; font-weight: 700; }
    .item-unit { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .item-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { border: 1px solid var(--line); background: white; width: 25px; height: 25px; border-radius: 8px; color: #4d5870; font-weight: 700; }
    .qty { min-width: 12px; text-align: center; font-size: 12px; }
    .line-total { text-align: right; font-size: 12px; font-weight: 700; margin-top: 7px; }
    .remove-btn { border: 0; color: #9098a8; background: none; font-size: 11px; padding: 3px 0 0; }
    .remove-btn:hover { color: #d34f61; }
    .coupon-row { display: flex; gap: 8px; margin: 15px 0; }
    .coupon-row input, .answer-row input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; outline: none; color: var(--ink); }
    .coupon-row input:focus, .answer-row input:focus { border-color: #aaa6ff; box-shadow: 0 0 0 3px #5b55e71c; }
    .coupon-row button { background: #f0efff; border: 0; color: var(--brand-dark); border-radius: 10px; padding: 0 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .coupon-hint { color: var(--muted); font-size: 10px; margin: -8px 0 12px; }
    .totals { border-top: 1px solid var(--line); padding-top: 12px; }
    .total-row { display: flex; justify-content: space-between; color: #69738a; font-size: 12px; padding: 5px 0; }
    .total-row.discount { color: #15936d; }
    .total-row.grand { color: var(--ink); font-size: 16px; font-weight: 800; padding-top: 10px; }
    .checkout-btn { width: 100%; margin-top: 15px; padding: 12px; }
    .checkout-btn:disabled { background: #c9cbd5; cursor: not-allowed; transform: none; }
    .secure-note { color: #9299a8; text-align: center; font-size: 10px; margin: 10px 0 0; }
    .practice-panel { padding: 19px; background: linear-gradient(145deg, #f1f0ff, #fff 75%); }
    .practice-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .practice-icon { background: #e3e1ff; color: var(--brand-dark); border-radius: 9px; width: 30px; height: 30px; display: grid; place-items: center; }
    .practice-heading h3 { font-size: 14px; margin: 0; }
    .practice-panel p { color: #68738a; font-size: 11px; line-height: 1.6; margin: 0 0 12px; }
    .challenge { border-radius: 11px; padding: 11px; background: #fff; font-size: 12px; line-height: 1.6; margin-bottom: 10px; }
    .challenge strong { color: var(--brand-dark); }
    .answer-row { display: flex; gap: 8px; }
    .answer-row input { padding: 9px; font-size: 12px; }
    .answer-row button { background: var(--ink); color: #fff; border: 0; border-radius: 9px; padding: 0 12px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .practice-feedback { min-height: 18px; font-size: 11px; margin-top: 8px; }
    .practice-feedback.good { color: #11835f; }
    .practice-feedback.bad { color: #c44c5d; }
    .new-question { border: 0; background: none; color: var(--brand-dark); font-size: 11px; font-weight: 700; padding: 4px 0 0; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; color: white; background: #20283a; padding: 11px 16px; border-radius: 12px; font-size: 13px; box-shadow: 0 10px 30px #17203330; transition: .25s; z-index: 3; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .modal-backdrop { display: none; position: fixed; inset: 0; background: #10162980; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(420px, 100%); background: white; border-radius: 20px; padding: 26px; text-align: center; box-shadow: 0 25px 80px #11182a55; }
    .success-icon { font-size: 40px; }
    .modal h2 { font-size: 20px; margin: 10px 0 5px; }
    .modal p { color: var(--muted); font-size: 13px; line-height: 1.7; }
    .modal .primary-btn { margin-top: 10px; padding: 11px 22px; }
    footer { color: #9299a8; text-align: center; font-size: 11px; margin-top: 28px; }
    @media (max-width: 850px) { .layout { grid-template-columns: minmax(0, 1fr) 320px; gap: 15px; } .products-panel { padding: 17px; } }
    @media (max-width: 700px) { .shell { padding: 20px 15px 44px; } header { margin-bottom: 25px; } .layout { grid-template-columns: 1fr; } .side { grid-row: 1; } .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 390px) { .product-grid { grid-template-columns: 1fr; } .demo-badge { font-size: 10px; padding: 7px 9px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🧾</div>
        <div><h1>小账房</h1><p>商品结算练习平台</p></div>
      </div>
      <div class="demo-badge">练习模式 · 不会产生真实订单</div>
    </header>

    <main>
      <div class="intro">
        <h2>来练习一次收银结算吧</h2>
        <p>挑选商品、调整数量、试试优惠码，再核对最终金额。</p>
      </div>
      <div class="layout">
        <section class="panel products-panel" aria-labelledby="products-heading">
          <div class="section-heading"><h3 id="products-heading">今日精选</h3><span>点击商品加入购物车</span></div>
          <div class="product-grid" id="product-grid"></div>
        </section>

        <aside class="side">
          <section class="panel cart-panel" aria-labelledby="cart-heading">
            <div class="cart-title"><div><h3 id="cart-heading">购物车</h3><span id="cart-subtitle">还没有添加商品</span></div><div class="cart-count" id="cart-count">0 件</div></div>
            <div class="cart-items" id="cart-items" aria-live="polite"></div>
            <div class="coupon-row">
              <input id="coupon-input" type="text" placeholder="输入优惠码" aria-label="优惠码" autocomplete="off">
              <button type="button" id="coupon-button">使用优惠</button>
            </div>
            <p class="coupon-hint">试试优惠码：SAVE10（满 ¥100 减 ¥10）</p>
            <div class="totals" aria-live="polite">
              <div class="total-row"><span>商品小计</span><strong id="subtotal">¥0.00</strong></div>
              <div class="total-row discount" id="discount-row" hidden><span>优惠</span><strong id="discount">−¥0.00</strong></div>
              <div class="total-row"><span>运费</span><strong id="shipping">¥0.00</strong></div>
              <div class="total-row grand"><span>应付金额</span><strong id="grand-total">¥0.00</strong></div>
            </div>
            <button type="button" class="primary-btn checkout-btn" id="checkout-button" disabled>确认结算</button>
            <p class="secure-note">🔒 这是模拟结算，不会收集支付信息</p>
          </section>

          <section class="panel practice-panel" aria-labelledby="practice-heading">
            <div class="practice-heading"><div class="practice-icon" aria-hidden="true">✦</div><h3 id="practice-heading">心算挑战</h3></div>
            <p>练习独立计算：先算商品金额，再按规则计算优惠和运费。</p>
            <div class="challenge" id="challenge-text"></div>
            <form class="answer-row" id="answer-form">
              <input id="answer-input" type="number" min="0" step="0.01" placeholder="输入应付金额" aria-label="输入你计算的应付金额" required>
              <button type="submit">检查答案</button>
            </form>
            <div class="practice-feedback" id="practice-feedback" aria-live="polite"></div>
            <button type="button" class="new-question" id="new-question">换一道题 ↗</button>
          </section>
        </aside>
      </div>
    </main>
    <footer>练习数据仅用于学习商品结算与金额计算。</footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="success-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="success-icon" aria-hidden="true">🎉</div>
      <h2 id="modal-title">模拟结算成功！</h2>
      <p id="modal-message"></p>
      <button type="button" class="primary-btn" id="continue-button">继续练习</button>
    </div>
  </div>

  <script>
    const products = [
      { id: 'coffee', name: '手冲咖啡豆', desc: '中度烘焙 · 250g', price: 6800, emoji: '☕', tag: '人气推荐' },
      { id: 'mug', name: '陶瓷随行杯', desc: '简约设计 · 350ml', price: 4500, emoji: '🍵', tag: '好物' },
      { id: 'notebook', name: '灵感笔记本', desc: '米白纸张 · 120页', price: 2800, emoji: '📓', tag: '文具' },
      { id: 'tote', name: '棉布帆布袋', desc: '加厚环保 · 日常款', price: 3600, emoji: '👜', tag: '环保' },
      { id: 'cookie', name: '黄油曲奇', desc: '手工烘焙 · 8枚装', price: 1950, emoji: '🍪', tag: '零食' },
      { id: 'plant', name: '桌面绿植', desc: '好养护 · 含陶盆', price: 5200, emoji: '🪴', tag: '生活' }
    ];
    const cart = new Map();
    let couponApplied = false;
    let toastTimer;
    let currentChallenge;
    const money = cents => `¥${(cents / 100).toFixed(2)}`;
    const byId = id => document.getElementById(id);

    function renderProducts() {
      byId('product-grid').innerHTML = products.map(product => `
        <article class="product">
          <div class="product-top"><div class="emoji" aria-hidden="true">${product.emoji}</div><span class="product-tag">${product.tag}</span></div>
          <h4>${product.name}</h4><p class="desc">${product.desc}</p>
          <div class="product-bottom"><div class="price">${money(product.price)} <small>/ 件</small></div><button type="button" class="add-btn" data-add="${product.id}" aria-label="添加${product.name}">＋ 加入</button></div>
        </article>`).join('');
    }

    function totals() {
      const subtotal = [...cart].reduce((sum, [id, quantity]) => sum + products.find(p => p.id === id).price * quantity, 0);
      const discount = couponApplied && subtotal >= 10000 ? 1000 : 0;
      const shipping = subtotal > 0 && subtotal < 8000 ? 800 : 0;
      return { subtotal, discount, shipping, grand: Math.max(0, subtotal - discount + shipping) };
    }

    function renderCart() {
      const count = [...cart.values()].reduce((sum, quantity) => sum + quantity, 0);
      byId('cart-count').textContent = `${count} 件`;
      byId('cart-subtitle').textContent = count ? `${count} 件商品已加入` : '还没有添加商品';
      if (!count) {
        byId('cart-items').innerHTML = '<div class="empty">🛒<br>购物车空空的，去挑几件喜欢的吧</div>';
      } else {
        byId('cart-items').innerHTML = [...cart].map(([id, quantity]) => {
          const product = products.find(p => p.id === id);
          return `<div class="cart-item">
            <div><div class="item-name">${product.emoji} ${product.name}</div><div class="item-unit">${money(product.price)} / 件</div>
              <button type="button" class="remove-btn" data-remove="${id}">移除</button></div>
            <div><div class="item-controls"><button type="button" class="qty-btn" data-change="${id}" data-delta="-1" aria-label="减少${product.name}数量">−</button><span class="qty">${quantity}</span><button type="button" class="qty-btn" data-change="${id}" data-delta="1" aria-label="增加${product.name}数量">＋</button></div>
              <div class="line-total">${money(product.price * quantity)}</div></div>
          </div>`;
        }).join('');
      }
      const amount = totals();
      byId('subtotal').textContent = money(amount.subtotal);
      byId('discount-row').hidden = amount.discount === 0;
      byId('discount').textContent = `−${money(amount.discount)}`;
      byId('shipping').textContent = amount.shipping ? money(amount.shipping) : '免运费';
      byId('grand-total').textContent = money(amount.grand);
      byId('checkout-button').disabled = count === 0;
      if (couponApplied && amount.subtotal < 10000) {
        byId('coupon-input').setAttribute('placeholder', '满 ¥100 可享优惠');
      } else if (amount.discount) {
        byId('coupon-input').setAttribute('placeholder', 'SAVE10 已使用');
      }
    }

    function showToast(message) {
      const toast = byId('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function applyCoupon() {
      const code = byId('coupon-input').value.trim().toUpperCase();
      if (code !== 'SAVE10') { showToast('优惠码不正确，再试试 SAVE10'); return; }
      const amount = totals();
      if (amount.subtotal < 10000) { showToast('商品满 ¥100 才能使用此优惠码'); return; }
      couponApplied = true;
      renderCart();
      showToast('优惠已使用：立减 ¥10');
    }

    function openChallenge() {
      const first = products[Math.floor(Math.random() * products.length)];
      let second = products[Math.floor(Math.random() * products.length)];
      while (second.id === first.id) second = products[Math.floor(Math.random() * products.length)];
      const q1 = Math.floor(Math.random() * 3) + 1;
      const q2 = Math.floor(Math.random() * 2) + 1;
      const subtotal = first.price * q1 + second.price * q2;
      const hasCoupon = subtotal >= 10000 && Math.random() > .4;
      const shipping = subtotal < 8000 ? 800 : 0;
      const discount = hasCoupon ? 1000 : 0;
      currentChallenge = { answer: subtotal - discount + shipping, first, second, q1, q2, hasCoupon, shipping, discount };
      byId('challenge-text').innerHTML = `买 <strong>${first.name} × ${q1}</strong> 和 <strong>${second.name} × ${q2}</strong>。${hasCoupon ? '使用 SAVE10 优惠码，满 ¥100 减 ¥10。' : '本题不使用优惠码。'}${shipping ? '订单未满 ¥80，运费 ¥8。' : '订单满 ¥80，免运费。'}你算出的应付金额是多少？`;
      byId('answer-input').value = '';
      byId('practice-feedback').textContent = '';
      byId('practice-feedback').className = 'practice-feedback';
    }

    byId('product-grid').addEventListener('click', event => {
      const button = event.target.closest('[data-add]');
      if (!button) return;
      const id = button.dataset.add;
      cart.set(id, (cart.get(id) || 0) + 1);
      renderCart();
      showToast(`${products.find(p => p.id === id).name} 已加入购物车`);
    });
    byId('cart-items').addEventListener('click', event => {
      const change = event.target.closest('[data-change]');
      const remove = event.target.closest('[data-remove]');
      if (change) {
        const id = change.dataset.change;
        const next = (cart.get(id) || 0) + Number(change.dataset.delta);
        if (next <= 0) cart.delete(id); else cart.set(id, next);
        renderCart();
      }
      if (remove) { cart.delete(remove.dataset.remove); renderCart(); }
    });
    byId('coupon-button').addEventListener('click', applyCoupon);
    byId('coupon-input').addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); applyCoupon(); } });
    byId('checkout-button').addEventListener('click', () => {
      const amount = totals();
      byId('modal-message').textContent = `本次模拟订单共 ${[...cart.values()].reduce((sum, quantity) => sum + quantity, 0)} 件商品，应付 ${money(amount.grand)}。没有产生真实交易。`;
      byId('success-modal').classList.add('open');
      byId('continue-button').focus();
    });
    byId('continue-button').addEventListener('click', () => {
      byId('success-modal').classList.remove('open');
      cart.clear(); couponApplied = false; byId('coupon-input').value = '';
      byId('coupon-input').setAttribute('placeholder', '输入优惠码');
      renderCart(); showToast('购物车已清空，继续练习吧！');
    });
    byId('success-modal').addEventListener('click', event => {
      if (event.target === byId('success-modal')) byId('success-modal').classList.remove('open');
    });
    byId('answer-form').addEventListener('submit', event => {
      event.preventDefault();
      const raw = byId('answer-input').value;
      const guess = Math.round(Number(raw) * 100);
      const feedback = byId('practice-feedback');
      if (guess === currentChallenge.answer) {
        feedback.textContent = `答对啦！应付金额是 ${money(currentChallenge.answer)}，计算很准确。`;
        feedback.className = 'practice-feedback good';
      } else {
        feedback.textContent = `再检查一下哦。正确金额是 ${money(currentChallenge.answer)}，注意优惠和运费规则。`;
        feedback.className = 'practice-feedback bad';
      }
    });
    byId('new-question').addEventListener('click', openChallenge);
    renderProducts(); renderCart(); openChallenge();
  </script>
</body>
</html>
